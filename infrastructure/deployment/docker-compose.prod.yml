# Production stack for a single VPS. Managed by the `gynx` command (installed by
# install.sh), which always runs:
#   docker compose -f infrastructure/deployment/docker-compose.prod.yml --env-file /etc/gynx/gynx.env ...
# Secrets live in /etc/gynx/gynx.env (root-only), never in the repository.

name: gynx

x-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://gynx:${POSTGRES_PASSWORD:?missing}@postgres:5432/gynx
  REDIS_URL: redis://redis:6379

x-app: &app
  image: gynx-app:latest
  pull_policy: never
  env_file: /etc/gynx/gynx.env
  environment: *app-env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gynx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: gynx
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gynx -d gynx']
      interval: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # One-shot: applies committed migrations, then exits. Everything else waits for it.
  migrate:
    <<: *app
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
    restart: 'no'
    working_dir: /app/packages/database
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  bot:
    <<: *app
    command: ['node', '--enable-source-maps', 'apps/bot/dist/index.js']
    depends_on: &after-migrate
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8081/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      start_period: 60s
    stop_grace_period: 30s

  worker:
    <<: *app
    command: ['node', '--enable-source-maps', 'apps/worker/dist/index.js']
    depends_on: *after-migrate
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8082/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      start_period: 30s
    stop_grace_period: 30s

  dashboard:
    <<: *app
    working_dir: /app/apps/dashboard
    command: ['./node_modules/.bin/next', 'start', '-p', '3000', '-H', '0.0.0.0']
    environment:
      <<: *app-env
      PORT: '3000'
      # Update feed: verifies GitHub webhook signatures. Empty = /api/webhooks/github answers 503.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on: *after-migrate
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      start_period: 30s

  # HTTPS reverse proxy. Obtains and renews Let's Encrypt certificates automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?missing}
      ACME_EMAIL: ${ACME_EMAIL:?missing}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [dashboard]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
