# Local development dependencies only. Run the apps with `pnpm dev:bot`, `pnpm dev:worker`
# and `pnpm dev:dashboard`. For production see infrastructure/deployment/ (VPS installer).
#   docker compose up -d
# Credentials below are for LOCAL DEVELOPMENT ONLY.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gynx
      POSTGRES_PASSWORD: gynx-dev-only
      POSTGRES_DB: gynx
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gynx -d gynx']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
