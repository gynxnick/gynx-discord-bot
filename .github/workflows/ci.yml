name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gynx
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gynx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gynx -d gynx_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gynx:ci-only@localhost:5432/gynx_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    # Builds the production image and validates the VPS compose file, so the
    # first real deploy isn't the first time the image is built.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/app.Dockerfile -t gynx-app:ci .
      - name: Smoke-test the built bundles start and validate config
        run: |
          docker run --rm gynx-app:ci node apps/bot/dist/index.js 2>&1 | grep -q 'Invalid configuration'
          docker run --rm gynx-app:ci node apps/worker/dist/index.js 2>&1 | grep -q 'Invalid configuration'
          docker run --rm -w /app/packages/database gynx-app:ci ./node_modules/.bin/prisma --version
      - name: Validate production compose file
        run: |
          sudo mkdir -p /etc/gynx
          printf 'POSTGRES_PASSWORD=x\nDASHBOARD_DOMAIN=example.com\nACME_EMAIL=a@example.com\n' | sudo tee /etc/gynx/gynx.env >/dev/null
          docker compose -f infrastructure/deployment/docker-compose.prod.yml --env-file /etc/gynx/gynx.env config --quiet
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning infrastructure/deployment/*.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
